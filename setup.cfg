[nosetests]
verbosity=1
with-coverage=1
cover-package=service
cover-erase=1
cover-min-percentage=95

[coverage:report]
show_missing = True
fail_under = 95

[coverage:run]
branch = True

[flake8]
max-line-length = 127
max-complexity = 10
exclude = .git,__pycache__,.venv,venv
per-file-ignores =
    */__init__.py: F401 E402

[pylint.'MESSAGES CONTROL']
disable=E1101
